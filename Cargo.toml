[package]
name = "tpreview"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
description = "Offline Markdown and Mermaid reader for your terminal"
license = "MIT"
repository = "https://github.com/affisto/tpreview"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
mmdflux = { version = "=2.6.1", default-features = false }
notify = "8.2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
