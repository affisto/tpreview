name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate installer and tag version
        run: python3 scripts/release.py version
      - name: Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Real PTY and simulated Kitty protocol
        run: python3 scripts/pty_smoke.py target/release/tpreview
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Isolated tmux integration
        if: runner.os == 'Linux'
        run: python3 scripts/tmux_smoke.py target/release/tpreview
      - name: Package native bundle and verify release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py package "$PACKAGE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tpreview-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  installer:
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sh -n install.sh scripts/publish-release.sh
      - run: python3 scripts/test_install.py
      - run: python3 scripts/release.py version
  release:
    name: Publish release bundles
    needs: [verify, installer]
    if: github.repository == 'affisto/tpreview' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tpreview-*
          path: dist/release
          merge-multiple: true
      - name: Verify all bundles and prepare installer checksums
        run: python3 scripts/release.py prepare dist/release
      - name: Attach bundles and publish atomically from draft
        run: sh scripts/publish-release.sh dist/release
      - name: Smoke test published downloads with curl and wget
        run: |
          for downloader in curl wget; do
            install_root=$(mktemp -d)
            if [ "$downloader" = curl ]; then
              curl -fsSL "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/install.sh" -o "$install_root/install.sh"
            else
              wget -qO "$install_root/install.sh" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/install.sh"
            fi
            sh "$install_root/install.sh" --downloader "$downloader" --bin-dir "$install_root/bin"
            "$install_root/bin/tpreview" --version
            "$install_root/bin/tpreview" --render text examples/demo.md > "$install_root/preview.txt"
            grep -q 'Publish' "$install_root/preview.txt"
            rm -rf "$install_root"
          done
