name: VS Code extension
on:
  push:
    branches: [main]
    tags: ['extension-v*']
    paths: ['extensions/vscode/**', '.github/workflows/vscode.yml', 'scripts/publish-vscode.sh']
  pull_request:
    paths: ['extensions/vscode/**', '.github/workflows/vscode.yml', 'scripts/publish-vscode.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-extension
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
            dist/vscode-editor-preview.png
          if-no-files-found: error
  release:
    name: Publish VSIX download
    needs: verify
    if: github.repository == 'affisto/tpreview' && startsWith(github.ref, 'refs/tags/extension-v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: vscode-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vscode-extension
          path: dist/vscode
      - name: Verify and publish extension package
        run: sh scripts/publish-vscode.sh dist/vscode
